# Crypto Trading — PostgreSQL + Web Service (schema-per-tenant)
# Kullanım: docker compose up --build
# İlk açılışta entrypoint: DB bekle → shared migrate → tenant migrate → seed → default tenant provision → start
services:
  postgres:
    image: postgres:16-alpine
    container_name: trading-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-app_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-app_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
      # Monolith imajı (web_app.py) — automation + simulation + tüm özellikler burada.
      # Hafif mikroservis için docker/Dockerfile (web-service) korunur; prod artık monolith.
      dockerfile: docker/Dockerfile.monolith.gpu
    container_name: trading-web
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    # .env'deki TÜM değişkenler container'a aktarılır: BINANCE_API_KEY/BINANCE_SECRET_KEY/BINANCE_TESTNET,
    # NEWSAPI_KEY, WHALE_ALERT_API_KEY, OLLAMA_*/INTELLIGENCE_* vb. (aksi halde container görmez → testnet
    # default 'true' kalır, keyler boş olur). Aşağıdaki environment: bloğundaki AÇIK değerler bunları EZER.
    env_file:
      - .env
    environment:
      # DB
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-app_db}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      APP_ENV: production
      # Monolith Flask (web_app.py: FLASK_HOST/FLASK_PORT/FLASK_DEBUG/FLASK_SECRET_KEY okur)
      FLASK_HOST: 0.0.0.0
      FLASK_PORT: 5000
      FLASK_DEBUG: "False"
      FLASK_SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
      # Cihaz: bu (varsayılan) imaj CPU'dur → CPU'ya zorla (temiz log, GPU aramaz).
      # GPU için docker-compose.gpu.yml override'ı bunu boşaltır. Bkz. .env.example.
      TRADING_FORCE_CPU: ""
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      # (Web-service ile geriye uyum için zararsız — monolith kullanmaz)
      WEB_HOST: 0.0.0.0
      WEB_PORT: 5000
      WEB_DEBUG: "False"
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
      # AI service (opsiyonel; ayrı çalıştırılır)
      AI_SERVICE_URL: ${AI_SERVICE_URL:-http://localhost:8000}
      # Market Intelligence + Ollama (LLM haber/sosyal analizi). Ollama host'ta 11434 yayınlar
      # → host.docker.internal ile erişilir (aşağıdaki extra_hosts). Default'lar KAPALI (opt-in).
      INTELLIGENCE_ENABLED: ${INTELLIGENCE_ENABLED:-false}
      AUTO_MARKET_INTEL_ENABLED: ${AUTO_MARKET_INTEL_ENABLED:-false}
      OLLAMA_ENABLED: ${OLLAMA_ENABLED:-false}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3.5:9b}
      OLLAMA_TIMEOUT_SECONDS: ${OLLAMA_TIMEOUT_SECONDS:-60}
      OLLAMA_MAX_RETRIES: ${OLLAMA_MAX_RETRIES:-2}
      OLLAMA_REQUIRE_JSON: ${OLLAMA_REQUIRE_JSON:-true}
      # Sosyal medya (Faz 5): Reddit + Google Trends
      INTEL_SOCIAL_ENABLED: ${INTEL_SOCIAL_ENABLED:-false}
      INTEL_GOOGLE_TRENDS_ENABLED: ${INTEL_GOOGLE_TRENDS_ENABLED:-true}
      # Seed/provision admin bilgileri (gerçek değerleri .env'den verin, commit ETMEYİN)
      PLATFORM_ADMIN_USERNAME: ${PLATFORM_ADMIN_USERNAME:-superadmin}
      PLATFORM_ADMIN_PASSWORD: ${PLATFORM_ADMIN_PASSWORD:-change-me}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-change-me}
      DEFAULT_TENANT_SLUG: ${DEFAULT_TENANT_SLUG:-default}
    # Host'ta çalışan Ollama'ya (11434) konteynerden erişim (Linux'ta host-gateway şart)
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${WEB_HOST_PORT:-5055}:5000"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # ai-service DB kullanmaz ve ML-ağırdır (TensorFlow/torch → büyük imaj).
  # İhtiyaç halinde ayrı bir Dockerfile ile eklenebilir; migrate/seed akışına dahil DEĞİLDİR.
  # ai:
  #   build: { context: ., dockerfile: docker/Dockerfile.ai }
  #   ports: ["8000:8000"]

  # Cloudflare Tunnel — web servisini (web:5000) internete açık bir hostname'e bağlar.
  # GÜVENLİK: token bir SECRET'tır → yalnız .env'de (gitignore'lu) tutulur, ASLA compose'a gömülmez.
  #   cloudflared, TUNNEL_TOKEN env'ini otomatik okur (token argv'de görünmez).
  #   Public hostname → http://web:5000 eşlemesi Cloudflare Zero Trust panelinden yapılır.
  # Opsiyonel servis (profil): `docker compose --profile tunnel up`
  #   veya .env'de COMPOSE_PROFILES=tunnel ile düz `docker compose up` içinde de açılır.
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: trading-cloudflared
    restart: unless-stopped
    profiles: ["tunnel"]
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?CLOUDFLARE_TUNNEL_TOKEN .env icinde tanimli olmali}
    depends_on:
      - web

volumes:
  postgres_data:

# Docker bridge MTU — bazı VPS/cloud/VPN ağlarında gerçek path MTU 1500'ün ALTINDA. Bu durumda
# container'dan giden/gelen büyük TLS handshake paketleri parçalanıp bozuluyor → "SSL: WRONG_VERSION_NUMBER"
# (aralıklı; host çalışır, container çalışmaz). 1400 çoğu ortamda güvenli. Değişince ağ yeniden yaratılmalı:
#   docker compose down && docker compose up -d
#networks:
#  default:
#    driver_opts:
#      com.docker.network.driver.mtu: 1400
