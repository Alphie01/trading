<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🧪 Yeni Simülasyon</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root{--bg:#070b12;--panel:#0f1522;--panel-2:#131b2b;--line:rgba(120,160,220,.12);--line-strong:rgba(120,160,220,.28);
              --txt:#d7e2f4;--txt-dim:#7d8ba6;--txt-faint:#4a5670;--cyan:#22d3ee;--green:#34d399;--amber:#fbbf24;--red:#f87171;--violet:#a78bfa;}
        *{box-sizing:border-box;} html,body{margin:0;padding:0;}
        body{background:var(--bg);color:var(--txt);font-family:'Chakra Petch',system-ui,sans-serif;min-height:100vh;position:relative;overflow-x:hidden;letter-spacing:.2px;}
        body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
            background:radial-gradient(1100px 700px at 80% -10%,rgba(52,211,153,.09),transparent 60%),
                       linear-gradient(var(--line) 1px,transparent 1px) 0 0/46px 46px,
                       linear-gradient(90deg,var(--line) 1px,transparent 1px) 0 0/46px 46px;
            mask-image:radial-gradient(circle at 50% 35%,#000 55%,transparent 100%);opacity:.5;}
        .shell{position:relative;z-index:1;max-width:960px;margin:0 auto;padding:22px 26px 60px;}
        .topbar{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:16px 20px;border:1px solid var(--line);border-radius:16px;
                background:linear-gradient(180deg,rgba(19,27,43,.9),rgba(15,21,34,.7));}
        .badge-icon{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;background:radial-gradient(circle,rgba(52,211,153,.18),transparent 70%);border:1px solid var(--line-strong);}
        .badge-icon i{color:var(--green);font-size:18px;}
        h1{font-size:19px;font-weight:700;margin:0;letter-spacing:1px;color:#eaf3ff;}
        .sub{color:var(--txt-faint);font-size:11px;letter-spacing:2px;}
        .spacer{flex:1;}
        .navlink{color:var(--txt-dim);font-size:12.5px;text-decoration:none;} .navlink:hover{color:var(--cyan);}
        .card-r{margin-top:16px;border:1px solid var(--line);border-radius:16px;background:linear-gradient(180deg,rgba(19,27,43,.55),rgba(15,21,34,.85));padding:22px 24px;}
        .sec-title{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--cyan);margin:6px 0 14px;padding-bottom:8px;border-bottom:1px solid var(--line);}
        .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;}
        label{display:block;font-size:11px;letter-spacing:.5px;color:var(--txt-dim);margin-bottom:6px;font-weight:500;}
        label .hint{color:var(--txt-faint);font-size:10px;text-transform:none;letter-spacing:0;}
        input,select{width:100%;background:var(--panel-2);border:1px solid var(--line-strong);border-radius:9px;color:var(--txt);
              padding:10px 12px;font-family:'JetBrains Mono',monospace;font-size:13px;outline:none;transition:.15s;}
        input:focus,select:focus{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(34,211,238,.1);}
        select option{background:#0f1522;}
        .seg{display:flex;gap:0;border:1px solid var(--line-strong);border-radius:9px;overflow:hidden;}
        .seg input{display:none;}
        .seg label{flex:1;margin:0;padding:11px 0;text-align:center;font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:1px;
                   color:var(--txt-dim);cursor:pointer;transition:.15s;background:var(--panel-2);}
        .seg input:checked + label{background:rgba(52,211,153,.14);color:var(--green);}
        .fut-only{display:none;}
        body.is-futures .fut-only{display:block;}
        .foot{margin-top:22px;display:flex;gap:12px;align-items:center;}
        .btn-primary-r{font-family:'JetBrains Mono',monospace;font-size:12.5px;letter-spacing:1.5px;text-transform:uppercase;border-radius:10px;padding:12px 22px;
               border:1px solid rgba(52,211,153,.5);color:#d9ffe9;background:linear-gradient(180deg,rgba(52,211,153,.22),rgba(52,211,153,.06));cursor:pointer;transition:.18s;}
        .btn-primary-r:hover{box-shadow:0 0 24px -6px rgba(52,211,153,.45);transform:translateY(-1px);}
        .btn-ghost{font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:1px;text-transform:uppercase;border-radius:10px;padding:12px 18px;
               border:1px solid var(--line-strong);color:var(--txt-dim);background:transparent;text-decoration:none;cursor:pointer;}
        .btn-ghost:hover{color:#fff;border-color:var(--txt-dim);}
        .safe{display:inline-flex;align-items:center;gap:7px;padding:6px 12px;border-radius:8px;font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:1px;
              color:var(--green);border:1px solid rgba(52,211,153,.35);background:rgba(52,211,153,.06);}
        #err{color:var(--red);font-family:'JetBrains Mono',monospace;font-size:12px;}
    </style>
</head>
<body>
<div class="shell">
    <div class="topbar">
        <div class="badge-icon"><i class="fas fa-vial-circle-check"></i></div>
        <div><h1>YENİ SİMÜLASYON</h1><div class="sub">SANAL PORTFÖY TANIMLA</div></div>
        <div class="spacer"></div>
        <span class="safe"><i class="fas fa-shield-halved"></i> SANAL</span>
        <a class="navlink" href="{{ url_for('simulation_list') }}"><i class="fas fa-arrow-left"></i> Listeye dön</a>
    </div>

    <form id="frm" class="card-r" onsubmit="return submitForm(event)">
        <div class="sec-title">Temel</div>
        <div class="grid">
            <div>
                <label>Simülasyon Adı</label>
                <input name="name" required placeholder="ör. Momentum Stratejisi #1" value="Simülasyon">
            </div>
            <div>
                <label>Başlangıç Bakiyesi <span class="hint">(USDT)</span></label>
                <input name="initial_balance" type="number" min="10" step="any" required value="10000">
            </div>
            <div>
                <label>Mod</label>
                <div class="seg">
                    <input type="radio" name="mode" id="m-spot" value="SPOT" checked onchange="onMode()">
                    <label for="m-spot">SPOT</label>
                    <input type="radio" name="mode" id="m-fut" value="FUTURES" onchange="onMode()">
                    <label for="m-fut">FUTURES</label>
                </div>
            </div>
        </div>

        <div class="fut-only" style="margin-top:16px">
            <div class="grid">
                <div>
                    <label>Kaldıraç <span class="hint">(x)</span></label>
                    <input name="leverage" type="number" min="1" max="125" step="1" value="5">
                </div>
                <div>
                    <label>Margin Modu</label>
                    <select name="margin_mode">
                        <option value="ISOLATED">ISOLATED</option>
                        <option value="CROSS">CROSS</option>
                    </select>
                </div>
            </div>
        </div>

        <div class="sec-title" style="margin-top:24px">Risk & Pozisyon</div>
        <div class="grid">
            <div>
                <label>İşlem Başı Risk <span class="hint">(bakiye %)</span></label>
                <input name="risk_per_trade" type="number" min="0.1" step="any" value="2">
            </div>
            <div>
                <label>Maks. Açık Pozisyon</label>
                <input name="max_open_positions" type="number" min="1" step="1" value="5">
            </div>
            <div>
                <label>Stop Loss <span class="hint">(%, 0=kapalı)</span></label>
                <input name="stop_loss" type="number" min="0" step="any" value="0">
            </div>
            <div>
                <label>Take Profit <span class="hint">(%, 0=kapalı)</span></label>
                <input name="take_profit" type="number" min="0" step="any" value="0">
            </div>
            <div>
                <label>Yeniden Giriş Politikası</label>
                <select name="reentry_policy">
                    <option value="ignore">Yoksay (ignore)</option>
                    <option value="average">Ortala (average)</option>
                    <option value="increase">Artır (increase)</option>
                </select>
            </div>
            <div>
                <label>Timeframe</label>
                <select name="timeframe">
                    <option>15m</option><option>1h</option><option selected>4h</option><option>1d</option>
                </select>
            </div>
        </div>

        <div class="sec-title" style="margin-top:24px">Semboller & Maliyet</div>
        <div class="grid">
            <div>
                <label>İzinli Semboller <span class="hint">(boş=hepsi, virgülle)</span></label>
                <input name="allowed_symbols" placeholder="BTC/USDT, ETH/USDT">
            </div>
            <div>
                <label>Hariç Semboller <span class="hint">(virgülle)</span></label>
                <input name="excluded_symbols" placeholder="USDC/USDT">
            </div>
            <div>
                <label>Fee Profili</label>
                <select name="fee_profile">
                    <option value="taker" selected>Taker (varsayılan)</option>
                    <option value="maker">Maker</option>
                </select>
            </div>
            <div>
                <label>Slippage <span class="hint">(oran, ör. 0.0005)</span></label>
                <input name="slippage" type="number" min="0" step="any" value="0.0005">
            </div>
            <div>
                <label>Başlangıç Durumu</label>
                <select name="initial_status">
                    <option value="RUNNING" selected>Hemen başlat (RUNNING)</option>
                    <option value="PAUSED">Duraklatılmış (PAUSED)</option>
                </select>
            </div>
        </div>

        <div class="foot">
            <button type="submit" class="btn-primary-r"><i class="fas fa-rocket"></i> Simülasyonu Başlat</button>
            <a class="btn-ghost" href="{{ url_for('simulation_list') }}">Vazgeç</a>
            <span id="err"></span>
        </div>
    </form>
</div>

<script>
function onMode(){
    document.body.classList.toggle('is-futures', document.getElementById('m-fut').checked);
}
onMode();

function numList(s){ return (s||'').split(',').map(x=>x.trim()).filter(Boolean); }

async function submitForm(e){
    e.preventDefault();
    const f = e.target;
    const err = document.getElementById('err'); err.textContent='';
    const mode = f.mode.value;
    const payload = {
        name: f.name.value.trim(),
        mode: mode,
        initial_balance: parseFloat(f.initial_balance.value),
        risk_per_trade: parseFloat(f.risk_per_trade.value),
        max_open_positions: parseInt(f.max_open_positions.value),
        stop_loss: parseFloat(f.stop_loss.value) || 0,
        take_profit: parseFloat(f.take_profit.value) || 0,
        reentry_policy: f.reentry_policy.value,
        timeframe: f.timeframe.value,
        allowed_symbols: numList(f.allowed_symbols.value),
        excluded_symbols: numList(f.excluded_symbols.value),
        fee_profile: f.fee_profile.value,
        slippage: parseFloat(f.slippage.value) || 0
    };
    if(mode==='FUTURES'){
        payload.leverage = parseInt(f.leverage.value) || 1;
        payload.margin_mode = f.margin_mode.value;
    }
    const btn = f.querySelector('button[type=submit]'); btn.disabled=true; btn.style.opacity=.6;
    try{
        const r = await fetch('/api/simulation/runs',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
        const d = await r.json();
        if(d.success && (d.id||d.simulation)){
            const id = d.id || d.simulation.id;
            // Yeni sim RUNNING açılır; kullanıcı PAUSED istediyse duraklat
            if(f.initial_status.value === 'PAUSED'){
                await fetch('/api/simulation/runs/'+id+'/pause',{method:'POST'});
            }
            window.location.href = '/simulation/'+id;
        }else{
            err.textContent = '⚠️ ' + (d.error||'Oluşturulamadı'); btn.disabled=false; btn.style.opacity=1;
        }
    }catch(ex){ err.textContent='⚠️ '+ex; btn.disabled=false; btn.style.opacity=1; }
    return false;
}
</script>
</body>
</html>
