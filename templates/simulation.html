<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🧪 Paper Trading Lab — Simülasyonlar</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root{--bg:#070b12;--panel:#0f1522;--panel-2:#131b2b;--line:rgba(120,160,220,.12);--line-strong:rgba(120,160,220,.28);
              --txt:#d7e2f4;--txt-dim:#7d8ba6;--txt-faint:#4a5670;--cyan:#22d3ee;--green:#34d399;--amber:#fbbf24;--red:#f87171;--violet:#a78bfa;}
        *{box-sizing:border-box;} html,body{margin:0;padding:0;}
        body{background:var(--bg);color:var(--txt);font-family:'Chakra Petch',system-ui,sans-serif;min-height:100vh;position:relative;overflow-x:hidden;letter-spacing:.2px;}
        body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
            background:radial-gradient(1100px 700px at 80% -10%,rgba(52,211,153,.09),transparent 60%),
                       linear-gradient(var(--line) 1px,transparent 1px) 0 0/46px 46px,
                       linear-gradient(90deg,var(--line) 1px,transparent 1px) 0 0/46px 46px;
            mask-image:radial-gradient(circle at 50% 35%,#000 55%,transparent 100%);opacity:.55;}
        .shell{position:relative;z-index:1;max-width:1440px;margin:0 auto;padding:22px 26px 60px;}
        .mono{font-family:'JetBrains Mono',monospace;}
        .topbar{display:flex;align-items:center;gap:18px;flex-wrap:wrap;padding:16px 20px;border:1px solid var(--line);border-radius:16px;
                background:linear-gradient(180deg,rgba(19,27,43,.9),rgba(15,21,34,.7));backdrop-filter:blur(6px);}
        .badge-icon{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;background:radial-gradient(circle,rgba(52,211,153,.18),transparent 70%);border:1px solid var(--line-strong);}
        .badge-icon i{color:var(--green);font-size:18px;}
        h1{font-size:20px;font-weight:700;margin:0;letter-spacing:1px;background:linear-gradient(90deg,#eaf3ff,var(--green));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;}
        .sub{color:var(--txt-faint);font-size:11px;letter-spacing:2px;}
        .safe{display:inline-flex;align-items:center;gap:7px;padding:6px 12px;border-radius:8px;font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:1px;
              color:var(--green);border:1px solid rgba(52,211,153,.35);background:rgba(52,211,153,.06);}
        .spacer{flex:1;}
        .navlink{color:var(--txt-dim);font-size:12.5px;text-decoration:none;padding:8px 4px;} .navlink:hover{color:var(--cyan);}
        .btn-r{font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:1.5px;text-transform:uppercase;border-radius:10px;padding:10px 16px;
               border:1px solid rgba(52,211,153,.5);color:#d9ffe9;background:linear-gradient(180deg,rgba(52,211,153,.18),rgba(52,211,153,.06));cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:8px;transition:.18s;}
        .btn-r:hover{box-shadow:0 0 24px -6px rgba(52,211,153,.4);transform:translateY(-1px);}
        .panel{margin-top:16px;border:1px solid var(--line);border-radius:16px;background:linear-gradient(180deg,rgba(19,27,43,.55),rgba(15,21,34,.85));overflow:hidden;}
        table{width:100%;border-collapse:collapse;}
        th{font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:1.5px;text-transform:uppercase;color:var(--txt-faint);text-align:left;padding:12px 14px;font-weight:500;}
        td{padding:13px 14px;border-top:1px solid var(--line);font-size:13px;vertical-align:middle;}
        tr:hover td{background:rgba(52,211,153,.03);}
        a.simname{color:#fff;font-weight:600;text-decoration:none;} a.simname:hover{color:var(--green);}
        .num{font-family:'JetBrains Mono',monospace;font-size:12.5px;}
        .st{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:1px;padding:4px 9px;border-radius:6px;border:1px solid transparent;}
        .st.RUNNING{color:var(--green);background:rgba(52,211,153,.1);border-color:rgba(52,211,153,.3);}
        .st.PAUSED{color:var(--amber);background:rgba(251,191,36,.1);border-color:rgba(251,191,36,.3);}
        .st.STOPPED,.st.COMPLETED{color:var(--txt-faint);background:rgba(74,86,112,.15);}
        .mode{font-family:'JetBrains Mono',monospace;font-size:10px;padding:3px 8px;border-radius:5px;border:1px solid var(--line-strong);color:var(--txt-dim);}
        .act{background:transparent;border:1px solid var(--line-strong);color:var(--txt-dim);border-radius:7px;padding:5px 8px;cursor:pointer;margin-right:4px;transition:.15s;}
        .act:hover{color:#fff;border-color:var(--cyan);}
        .act.danger:hover{color:var(--red);border-color:var(--red);}
        .empty{padding:40px;text-align:center;color:var(--txt-faint);font-family:'JetBrains Mono',monospace;font-size:13px;}
        .pos{color:var(--green);} .neg{color:var(--red);}
    </style>
</head>
<body>
<div class="shell">
    <div class="topbar">
        <div class="badge-icon"><i class="fas fa-flask-vial"></i></div>
        <div><h1>PAPER TRADING LAB</h1><div class="sub">SİMÜLASYON LABORATUVARI</div></div>
        <span class="safe"><i class="fas fa-shield-halved"></i> SANAL — GERÇEK İŞLEM YOK</span>
        <div class="spacer"></div>
        <a class="navlink" href="{{ url_for('automation_dashboard') }}"><i class="fas fa-satellite-dish"></i> Market Radar</a>
        <a class="navlink" href="{{ url_for('dashboard') }}"><i class="fas fa-gauge-high"></i> Dashboard</a>
        <a class="btn-r" href="{{ url_for('simulation_new') }}"><i class="fas fa-plus"></i> Yeni Simülasyon</a>
    </div>

    <div class="panel">
        <div style="overflow-x:auto;">
        <table>
            <thead><tr>
                <th>İsim</th><th>Durum</th><th>Mod</th><th>Başlangıç</th><th>Güncel</th>
                <th>Net Kâr</th><th>ROI</th><th>Win %</th><th>Açık</th><th>İşlem</th><th>Başladı</th><th>Aksiyon</th>
            </tr></thead>
            <tbody id="rows"><tr><td colspan="12" class="empty">Yükleniyor…</td></tr></tbody>
        </table>
        </div>
    </div>
</div>

<script>
const $ = (id)=>document.getElementById(id);
const j = (u,o)=>fetch(u,o).then(r=>r.json()).catch(e=>({success:false,error:String(e)}));
const fmt = (v,d=2)=>(v==null)?'—':Number(v).toFixed(d);

async function load(){
    const r = await j('/api/simulation/runs');
    const sims = (r.success? r.simulations:[])||[];
    if(!sims.length){ $('rows').innerHTML='<tr><td colspan="12" class="empty">Henüz simülasyon yok. "Yeni Simülasyon" ile başlayın.</td></tr>'; return; }
    // her sim için metrics çek (net profit/roi/win rate)
    const enriched = await Promise.all(sims.map(async s=>{
        const m = await j('/api/simulation/runs/'+s.id+'/metrics');
        return {...s, m:(m.success? m.metrics:{})};
    }));
    $('rows').innerHTML = enriched.map(s=>{
        const m = s.m||{};
        const net = m.net_profit||0, roi = m.roi_percent||0;
        return `<tr>
            <td><a class="simname" href="/simulation/${s.id}">${s.name}</a></td>
            <td><span class="st ${s.status}">${s.status}</span></td>
            <td><span class="mode">${s.mode}</span></td>
            <td class="num">${fmt(s.initial_balance)}</td>
            <td class="num">${fmt(s.current_balance)}</td>
            <td class="num ${net>=0?'pos':'neg'}">${net>=0?'+':''}${fmt(net)}</td>
            <td class="num ${roi>=0?'pos':'neg'}">${roi>=0?'+':''}${fmt(roi)}%</td>
            <td class="num">${fmt(m.win_rate,1)}%</td>
            <td class="num">${m.open_positions??0}</td>
            <td class="num">${m.total_trades??0}</td>
            <td class="num" style="color:var(--txt-faint)">${(s.started_at||'').replace('T',' ').slice(0,16)}</td>
            <td style="white-space:nowrap">
                <a class="act" href="/simulation/${s.id}" title="Görüntüle"><i class="fas fa-eye"></i></a>
                ${s.status==='RUNNING'?`<button class="act" onclick="act(${s.id},'pause')" title="Duraklat"><i class="fas fa-pause"></i></button>`:''}
                ${s.status==='PAUSED'?`<button class="act" onclick="act(${s.id},'resume')" title="Devam"><i class="fas fa-play"></i></button>`:''}
                ${s.status!=='STOPPED'?`<button class="act" onclick="act(${s.id},'stop')" title="Durdur"><i class="fas fa-stop"></i></button>`:''}
                <button class="act danger" onclick="del(${s.id})" title="Sil"><i class="fas fa-trash"></i></button>
            </td>
        </tr>`;
    }).join('');
}
async function act(id,a){ await j('/api/simulation/runs/'+id+'/'+a,{method:'POST'}); load(); }
async function del(id){ if(!confirm('Simülasyon silinsin mi? (tüm pozisyon/işlemler)')) return; await j('/api/simulation/runs/'+id,{method:'DELETE'}); load(); }
load();
setInterval(load, 20000);
</script>
</body>
</html>
